[package]
name = "fol-discord"
version = "0.2.6"
edition = "2021"
description = "Corrige o problema do Discord no Brasil fazendo o handshake sair por um IP estrangeiro"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json"] }
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
tauri-winres = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
