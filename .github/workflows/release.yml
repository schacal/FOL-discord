name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: interface/package-lock.json

      - name: Dependências da interface
        run: npm ci --prefix interface

      - name: Testes do serviço
        run: cargo test --release

      - name: Build do instalador
        run: npm --prefix interface run tauri -- build --bundles nsis

      - name: Testes da embalagem
        run: npm --prefix interface test

      - name: Publicar setup
        uses: actions/upload-artifact@v4
        with:
          name: fol-discord-setup
          path: interface/src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Publicar CLI
        uses: actions/upload-artifact@v4
        with:
          name: fol-discord-cli
          path: target/release/fol-discord.exe

      # O botão de baixar do README aponta para um nome fixo em
      # releases/latest/download. O NSIS carimba a versão no nome do arquivo,
      # então publicamos também uma cópia com nome estável — sem ela, o botão
      # quebraria a cada versão nova.
      - name: Cópia do instalador com nome estável
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $setup = Get-ChildItem interface/src-tauri/target/release/bundle/nsis/*-setup.exe |
            Select-Object -First 1
          if (-not $setup) { throw "o build nao gerou o instalador NSIS" }
          Copy-Item $setup.FullName FOL-discord-setup.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FOL-discord-setup.exe
            interface/src-tauri/target/release/bundle/nsis/*-setup.exe
            target/release/fol-discord.exe
          generate_release_notes: true
