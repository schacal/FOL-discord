[package]
name = "fol-discord-janela"
version = "0.2.6"
edition = "2021"
description = "Janela de gerenciamento do FOL-discord"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# 2.2 é o mínimo: `show_menu_on_left_click` nasceu nela (antes era
# `menu_on_left_click`), e é o que faz o clique esquerdo abrir a janela em vez
# do menu.
tauri = { version = "2.2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
winreg = "0.52"
# Encontrar e encerrar processos pela API, em vez de chamar `tasklist` e
# `taskkill`: os dois utilitarios sao o que a heuristica de antivirus observa.
windows-sys = { version = "0.59", features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
